name: Build iOS Tweak

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      
      - name: Build dylib
        run: |
          xcrun clang -dynamiclib -arch arm64 -isysroot $(xcrun --sdk iphoneos --show-sdk-path) -mios-version-min=15.0 -fobjc-arc -framework UIKit -framework Foundation -lobjc -o SkipSplashAd.dylib SkipSplashAd.m
          codesign -f -s - SkipSplashAd.dylib
          ls -la SkipSplashAd.dylib
      
      - name: Package deb
        run: |
          mkdir -p build/var/jb/Library/MobileSubstrate/DynamicLibraries
          cp SkipSplashAd.dylib build/var/jb/Library/MobileSubstrate/DynamicLibraries/
          cp SkipSplashAd.plist build/var/jb/Library/MobileSubstrate/DynamicLibraries/
          mkdir -p build/DEBIAN
          cp control build/DEBIAN/
          cd build/DEBIAN && tar czf ../../control.tar.gz . && cd ../..
          cd build && tar czf ../data.tar.gz var && cd ..
          echo "2.0" > debian-binary
          ar -rc com.tweaks.skipsplashad_1.0.0_iphoneos-arm64.deb debian-binary control.tar.gz data.tar.gz
          ls -lh *.deb
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipSplashAd
          path: com.tweaks.skipsplashad_1.0.0_iphoneos-arm64.deb
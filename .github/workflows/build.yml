name: Build iOS Tweak

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
      
      - name: Build dylib
        run: |
          mkdir -p build/var/jb/Library/MobileSubstrate/DynamicLibraries
          
          clang -dynamiclib \
            -arch arm64 \
            -framework UIKit \
            -framework Foundation \
            -lobjc \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -mios-version-min=15.0 \
            -fobjc-arc \
            -o build/var/jb/Library/MobileSubstrate/DynamicLibraries/SkipSplashAd.dylib \
            SkipSplashAd.m
          
          codesign -f -s - build/var/jb/Library/MobileSubstrate/DynamicLibraries/SkipSplashAd.dylib
          cp SkipSplashAd.plist build/var/jb/Library/MobileSubstrate/DynamicLibraries/
      
      - name: Create PreferenceBundle
        run: |
          mkdir -p build/var/jb/Library/PreferenceBundles/SkipSplashAd.bundle
          cp Root.plist build/var/jb/Library/PreferenceBundles/SkipSplashAd.bundle/
          
          # 创建简单的设置入口 plist
          cat > build/var/jb/Library/PreferenceLoader/Preferences/SkipSplashAd.plist << 'EOF'
          {
              filter = {
                  bundles = ("com.apple.Preferences");
              };
              entry = {
                  bundle = SkipSplashAd;
                  cell = PSLinkCell;
                  icon = "/var/jb/Library/PreferenceBundles/SkipSplashAd.bundle/icon@2x.png";
                  isController = 1;
                  label = SkipSplashAd;
              };
          }
          EOF
      
      - name: Create deb package
        run: |
          mkdir -p build/DEBIAN
          cp control build/DEBIAN/
          
          # 创建 control.tar.gz
          cd build/DEBIAN
          tar czf ../../control.tar.gz .
          cd ../..
          
          # 创建 data.tar.gz
          cd build
          tar czf ../data.tar.gz var
          cd ..
          
          echo "2.0" > debian-binary
          ar -rc com.tweaks.skipsplashad_1.0.0_iphoneos-arm64.deb debian-binary control.tar.gz data.tar.gz
          
          ls -lh *.deb
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipSplashAd
          path: com.tweaks.skipsplashad_1.0.0_iphoneos-arm64.deb
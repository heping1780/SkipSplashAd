name: Build iOS Tweak

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
      
      - name: Build dylib
        run: |
          mkdir -p build/var/jb/Library/MobileSubstrate/DynamicLibraries
          
          clang -dynamiclib \
            -arch arm64 \
            -framework UIKit \
            -framework Foundation \
            -lobjc \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -mios-version-min=15.0 \
            -fobjc-arc \
            -o build/var/jb/Library/MobileSubstrate/DynamicLibraries/SkipSplashAd.dylib \
            SkipSplashAd.m
          
          codesign -f -s - build/var/jb/Library/MobileSubstrate/DynamicLibraries/SkipSplashAd.dylib
          cp SkipSplashAd.plist build/var/jb/Library/MobileSubstrate/DynamicLibraries/
      
      - name: Create default config
        run: |
          # 创建默认配置文件
          mkdir -p build/var/mobile/Library/Preferences
          cat > build/var/mobile/Library/Preferences/com.tweaks.skipsplashad.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>enabled</key>
              <true/>
              <key>autoClick</key>
              <false/>
              <key>whitelist</key>
              <array>
                  <string>com.apple.mobilesafari</string>
                  <string>com.apple.Preferences</string>
                  <string>com.apple.AppStore</string>
                  <string>com.tencent.xin</string>
                  <string>com.alipay.iphoneAlipay</string>
              </array>
              <key>blacklist</key>
              <array/>
              <key>customKeywords</key>
              <array/>
          </dict>
          </plist>
          EOF
      
      - name: Create deb package
        run: |
          mkdir -p build/DEBIAN
          cat > build/DEBIAN/control << 'EOF'
          Package: com.tweaks.skipsplashad
          Name: SkipSplashAd
          Version: 1.0.0
          Architecture: iphoneos-arm64
          Description: Skip iOS splash ads - Dopamine compatible
          Maintainer: YourName
          Author: YourName
          Section: Tweaks
          Depends: mobilesubstrate
          EOF
          
          cd build/DEBIAN
          tar czf ../../control.tar.gz .
          cd ../..
          
          cd build
          tar czf ../data.tar.gz var
          cd ..
          
          echo "2.0" > debian-binary
          ar -rc com.tweaks.skipsplashad_1.0.0_iphoneos-arm64.deb debian-binary control.tar.gz data.tar.gz
          
          ls -lh *.deb
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipSplashAd
          path: com.tweaks.skipsplashad_1.0.0_iphoneos-arm64.deb